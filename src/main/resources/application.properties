spring.application.name=haversack

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/haversack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración adicional para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database=mysql

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Server
server.port=8080

# JSON
spring.jackson.serialization.indent-output=true

# JWT Configuration
jwt.secret=haversack-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-and-secure
jwt.expiration=86400000
