services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: haversack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: haversack_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: haversack
      MYSQL_PASSWORD: haversackpass
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - haversack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin - Interfaz web para administrar MySQL
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: haversack-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: haversack
      PMA_PASSWORD: haversackpass
      MYSQL_ROOT_PASSWORD: rootpassword
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    networks:
      - haversack-network

  # Aplicación Spring Boot
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: haversack-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Configuración de la base de datos
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/haversack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: haversack
      SPRING_DATASOURCE_PASSWORD: haversackpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      # Configuración de seguridad
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123
      
      # Configuración JWT (debe coincidir con application.properties)
      JWT_SECRET: haversack-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-and-secure
      JWT_EXPIRATION: 86400000
      
      # Zona horaria
      TZ: UTC
    ports:
      - "8080:8080"
    networks:
      - haversack-network

networks:
  haversack-network:
    driver: bridge

volumes:
  db_data:

